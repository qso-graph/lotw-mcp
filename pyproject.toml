[project]
name = "lotw-mcp"
version = "0.5.0"
description = "MCP server for ARRL Logbook of The World — QSO query, QSL status, DXCC credit"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "Greg Beam, KI7MT", email = "maintainers@qso-graph.io"}]
requires-python = ">=3.11"
dependencies = [
    "qso-graph-auth>=0.1.1",
    "fastmcp>=4.0,<5",
    "certifi",
]
keywords = [
    "amateur-radio", "ham-radio", "lotw", "logbook-of-the-world", "arrl",
    "mcp", "model-context-protocol", "dxcc", "qsl",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Communications :: Ham Radio",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://qso-graph.io"
Documentation = "https://qso-graph.io/servers/lotw/"
Repository = "https://github.com/qso-graph/lotw-mcp"
Issues = "https://github.com/qso-graph/lotw-mcp/issues"

[project.scripts]
lotw-mcp = "lotw_mcp.server:main"


[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6.8", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lotw_mcp"]

# Lint and type settings follow adif-mcp, the reference for every qso-graph
# Python repo (qso-graph-devel#66). Copied rather than invented so the repos do
# not each grow a style of their own.
[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
line-length = 95
extend-exclude = [".venv", "dist", "build", ".eggs", ".pytest_cache", "site"]

[tool.ruff.lint]
# F and I are the rules that find defects: an unused import, an undefined name,
# an import block out of order. They run here from the start.
#
# E501 is a width, and it was deferred here while the rules that find defects
# went in first (qso-graph-devel#70). That pass has now happened for this repo
# (#22): it reported four lines, none of them a defect. Two reflowed.
#
# The other two are ADIF records in the sample LoTW responses, and an ADIF
# record is written on one line. They live in `_mock_adif.py`, which carries a
# file-level `# ruff: noqa: E501` and the reason — so the exemption covers a
# file holding nothing but sample data rather than several hundred lines of
# real code, which a `per-file-ignores` entry on client.py would have done.
# This project's rule is that the owner of a list is its authority; the same
# applies to a publisher's wire format, and there the shape is the point.
select = ["E", "F", "I"]
ignore = []
fixable = ["I"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
ignore_missing_imports = true
